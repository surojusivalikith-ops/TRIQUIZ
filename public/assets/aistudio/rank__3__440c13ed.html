<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>compile&rank — placement test prep</title>
<style>
:root{
  --bg:#0d1117;
  --panel:#12181f;
  --panel-2:#161d26;
  --line:#232b35;
  --text:#e6edf3;
  --muted:#7d8894;
  --mono: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace;
  --sans: 'Inter',ui-sans-serif,system-ui,sans-serif;
  --accent:#00d9a0;
  --accent-dim:#0a3d31;
  --red:#ff6b6b;
  --amber:#ffb454;
  --py:#4b8bbe; --java:#e76f51; --c:#5da9e9; --cpp:#f28ab2; --html:#ff9d5c; --crt:#b48ce0; --gk:#6fcf97; --neet:#e0b04b; --jee:#5ce0c6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;background-image:
  radial-gradient(circle at 15% 10%, rgba(0,217,160,0.06), transparent 40%),
  radial-gradient(circle at 85% 90%, rgba(228,111,81,0.05), transparent 40%);}
::selection{background:var(--accent);color:#04140f;}

.app{max-width:920px;margin:0 auto;padding:28px 18px 80px;}

/* terminal window chrome — signature element */
.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);}
.term-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.r{background:#ff5f57;} .dot.y{background:#febc2e;} .dot.g{background:#28c840;}
.term-path{margin-left:10px;font-family:var(--mono);font-size:12px;color:var(--muted);}
.term-body{padding:26px 28px;}

/* brand */
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.brand-name{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:0.5px;}
.brand-name .amp{color:var(--accent);}
.brand-user{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px;}
.brand-user button{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;}
.brand-user button:hover{color:var(--text);border-color:var(--muted);}

h1.hero{font-family:var(--mono);font-size:26px;line-height:1.35;margin:0 0 6px;}
h1.hero .cursor{display:inline-block;width:9px;height:20px;background:var(--accent);margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-3px;}
@keyframes blink{50%{opacity:0;}}
p.sub{color:var(--muted);margin:0 0 26px;font-size:14px;}

/* form */
label{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin:14px 0 6px;text-transform:lowercase;}
input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:7px;font-family:var(--mono);font-size:13px;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#04140f;border:none;font-family:var(--mono);font-weight:700;font-size:13px;padding:11px 20px;border-radius:7px;cursor:pointer;margin-top:18px;transition:transform .1s, box-shadow .15s;}
.btn:hover{box-shadow:0 8px 24px -8px rgba(0,217,160,0.5);transform:translateY(-1px);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600;}
.btn.ghost:hover{border-color:var(--muted);}
.btn.small{padding:7px 14px;font-size:11px;margin-top:0;}
.btn:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;transform:none;}
.err{color:var(--red);font-family:var(--mono);font-size:12px;margin-top:12px;min-height:14px;}
.switch-line{margin-top:18px;font-size:12.5px;color:var(--muted);}
.switch-line a{color:var(--accent);cursor:pointer;text-decoration:none;}
.switch-line a:hover{text-decoration:underline;}

/* subject grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:6px;}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;transition:border-color .15s, transform .12s;position:relative;overflow:hidden;}
.card:hover{border-color:var(--accent-line,var(--accent));transform:translateY(-2px);}
.card .tag{position:absolute;top:0;left:0;bottom:0;width:4px;}
.card .lang{font-family:var(--mono);font-size:15px;font-weight:700;margin-bottom:4px;}
.card .desc{color:var(--muted);font-size:12px;line-height:1.5;}
.card .count{margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--muted);}
.card .count b{color:var(--text);}

/* quiz */
.progressbar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-bottom:22px;}
.progressbar > div{height:100%;background:var(--accent);transition:width .2s linear;}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:14px;}
.timer{color:var(--amber);}
.timer.low{color:var(--red);}
.qtext{font-size:17px;line-height:1.55;margin:0 0 20px;font-weight:600;}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:10px;cursor:pointer;font-size:14px;transition:border-color .12s, background .12s;}
.opt:hover{border-color:var(--muted);}
.opt.selected{border-color:var(--accent);background:rgba(0,217,160,0.07);}
.opt.correct{border-color:var(--accent);background:rgba(0,217,160,0.12);}
.opt.wrong{border-color:var(--red);background:rgba(255,107,107,0.1);}
.opt .k{font-family:var(--mono);color:var(--muted);width:16px;flex-shrink:0;}
.opt.correct .k, .opt.wrong .k{color:inherit;}
.qfooter{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}

/* results */
.score-hero{text-align:center;padding:10px 0 24px;}
.score-num{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--accent);line-height:1;}
.score-of{color:var(--muted);font-family:var(--mono);font-size:14px;margin-top:6px;}
.score-verdict{margin-top:10px;font-size:13px;color:var(--muted);}
table.lb{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
table.lb th{text-align:left;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px 10px;border-bottom:1px solid var(--line);}
table.lb td{padding:10px;border-bottom:1px solid var(--line);}
table.lb tr.me{background:rgba(0,217,160,0.07);}
table.lb td.rank{font-family:var(--mono);color:var(--muted);width:36px;}
table.lb td.rank.top1{color:#ffd166;} table.lb td.rank.top2{color:#c9d6df;} table.lb td.rank.top3{color:#d6a15a;}
.nav-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

.tabbar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.tab{font-family:var(--mono);font-size:12px;padding:7px 13px;border-radius:6px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:var(--panel-2);}
.tab.active{color:var(--text);border-color:var(--accent);}

.empty{color:var(--muted);font-size:13px;font-family:var(--mono);padding:20px 0;text-align:center;}
.note{font-size:11.5px;color:var(--muted);margin-top:22px;border-top:1px dashed var(--line);padding-top:14px;}
</style>
</head>

/* ---------------- procedural question generators ----------------
   The static BANK above is a fixed, hand-checked set. To go beyond a few
   hundred questions without sacrificing correctness, these generators build
   fresh questions with randomized numbers every time a quiz starts — the
   right answer is computed in code, not guessed, so it's always accurate.
   This covers CRT aptitude (formula-driven word problems) and code-output
   prediction for Python/Java/C/C++ (simple integer arithmetic, whose result
   is identical across all four languages, so one computed value is valid
   for all of them). HTML/CSS and GK stay static — they're fact-based, and
   safely randomizing facts isn't possible the same way.
------------------------------------------------------------------ */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function mcqFromValue(correct, suffix){
  suffix = suffix || '';
  const seen = new Set([correct]);
  const distractors = [];
  const spread = Math.max(4, Math.round(Math.abs(correct)*0.25));
  while(distractors.length < 3){
    const delta = randInt(1, spread) * (Math.random()<0.5?-1:1);
    let d = correct + delta;
    if(seen.has(d)) continue;
    seen.add(d);
    distractors.push(d);
  }
  const vals = shuffle([correct, ...distractors]);
  const opts = vals.map(v => v + suffix);
  const ans = vals.indexOf(correct);
  return {opts, ans};
}

function genArithmeticQuestion(langId){
  const termCount = randInt(2,3);
  const nums = []; for(let i=0;i<termCount;i++) nums.push(randInt(2,15));
  const ops = []; for(let i=0;i<termCount-1;i++) ops.push(['+','-','*'][randInt(0,2)]);
  let exprStr;
  if(termCount===3 && Math.random()<0.5){
    exprStr = `(${nums[0]} ${ops[0]} ${nums[1]}) ${ops[1]} ${nums[2]}`;
  } else {
    exprStr = String(nums[0]);
    for(let i=1;i<nums.length;i++) exprStr += ` ${ops[i-1]} ${nums[i]}`;
  }
  const correct = Function('"use strict"; return (' + exprStr + ')')();
  let codeLine, label;
  if(langId==='python'){ codeLine = `print(${exprStr})`; label='Python'; }
  else if(langId==='java'){ codeLine = `System.out.println(${exprStr});`; label='Java'; }
  else if(langId==='c'){ codeLine = `printf("%d", ${exprStr});`; label='C'; }
  else { codeLine = `cout << (${exprStr});`; label='C++'; }
  const {opts, ans} = mcqFromValue(correct);
  return Q(`[${label}] What does this print?  \`${codeLine}\``, opts, ans);
}

function genCrtQuestion(){
  const templates = [
    ()=>{
      const speed = randInt(30,90), time = randInt(2,6), dist = speed*time;
      const {opts, ans} = mcqFromValue(dist, ' km');
      return Q(`A vehicle travels at ${speed} km/h for ${time} hours. What distance does it cover?`, opts, ans);
    },
    ()=>{
      const p = randInt(1000,9000), r = randInt(4,15), t = randInt(2,6);
      const si = Math.round(p*r*t/100);
      const {opts, ans} = mcqFromValue(si);
      return Q(`Find the simple interest on ₹${p} at ${r}% per annum for ${t} years.`, opts, ans);
    },
    ()=>{
      const pct = randInt(5,60), base = randInt(50,500);
      const val = Math.round(base*pct/100);
      const {opts, ans} = mcqFromValue(val);
      return Q(`What is ${pct}% of ${base}?`, opts, ans);
    },
    ()=>{
      const n = randInt(4,6);
      const nums = Array.from({length:n}, ()=>randInt(10,90));
      const avg = Math.round(nums.reduce((a,b)=>a+b,0)/n);
      const {opts, ans} = mcqFromValue(avg);
      return Q(`Find the average of: ${nums.join(', ')}`, opts, ans);
    },
    ()=>{
      const cp = randInt(200,2000), profitPct = randInt(5,40);
      const sp = Math.round(cp*(100+profitPct)/100);
      const {opts, ans} = mcqFromValue(profitPct, '%');
      return Q(`A shopkeeper buys an item for ₹${cp} and sells it for ₹${sp}. What is the profit percentage?`, opts, ans);
    },
    ()=>{
      const a = randInt(3,9), d = randInt(2,7);
      const seq = Array.from({length:5}, (_,i)=> a + i*d);
      const next = a + 5*d;
      const {opts, ans} = mcqFromValue(next);
      return Q(`Find the next number in the series: ${seq.join(', ')}, ?`, opts, ans);
    },
    ()=>{
      const w1 = randInt(5,15), w2 = randInt(6,20);
      // A does job in w1 days, B in w2 days; days together = lcm-free: 1/(1/w1+1/w2)
      const together = Math.round((w1*w2)/(w1+w2));
      const {opts, ans} = mcqFromValue(together, ' days');
      return Q(`A can finish a job in ${w1} days and B can finish it in ${w2} days. Working together, roughly how many days will they take?`, opts, ans);
    },
  ];
  return templates[randInt(0,templates.length-1)]();
}

function genJeeQuestion(){
  const templates = [
    ()=>{ // v = u + at
      const u = randInt(0,20), a = randInt(1,10), t = randInt(1,10);
      const v = u + a*t;
      const {opts, ans} = mcqFromValue(v, ' m/s');
      return Q(`A body starts with an initial velocity of ${u} m/s and accelerates at ${a} m/s² for ${t} s. Find its final velocity (v = u + at).`, opts, ans);
    },
    ()=>{ // s = ut + 1/2 at^2, keep a as integer, t small so exact
      const u = randInt(0,10), a = randInt(2,10), t = randInt(2,6);
      const s = u*t + Math.round(0.5*a*t*t);
      const {opts, ans} = mcqFromValue(s, ' m');
      return Q(`A body starts with velocity ${u} m/s and accelerates uniformly at ${a} m/s² for ${t} s. Find the distance covered (s = ut + ½at²).`, opts, ans);
    },
    ()=>{ // Ohm's law V = IR
      const i = randInt(1,10), r = randInt(2,50);
      const v = i*r;
      const {opts, ans} = mcqFromValue(v, ' V');
      return Q(`A current of ${i} A flows through a resistor of ${r} Ω. Find the voltage across it (V = IR).`, opts, ans);
    },
    ()=>{ // work = force * distance
      const f = randInt(5,100), d = randInt(2,20);
      const w = f*d;
      const {opts, ans} = mcqFromValue(w, ' J');
      return Q(`A constant force of ${f} N moves an object through a distance of ${d} m in its own direction. Find the work done (W = F × d).`, opts, ans);
    },
    ()=>{ // moles = mass / molar mass (choose molar mass that divides evenly)
      const molarMass = [2,18,44,32,28,17][randInt(0,5)];
      const moles = randInt(1,10);
      const mass = molarMass*moles;
      const {opts, ans} = mcqFromValue(moles, ' mol');
      return Q(`Find the number of moles in ${mass} g of a substance with molar mass ${molarMass} g/mol (n = mass / molar mass).`, opts, ans);
    },
    ()=>{ // quadratic roots sum/product style: simple factorable quadratic x^2 - (sum)x + product
      const r1 = randInt(1,9), r2 = randInt(1,9);
      const sum = r1+r2, prod = r1*r2;
      const {opts, ans} = mcqFromValue(sum);
      return Q(`If the roots of x² − px + ${prod} = 0 are ${r1} and ${r2}, find p (the sum of the roots).`, opts, ans);
    },
    ()=>{ // simple kinetic energy KE = 1/2 m v^2, choose m even and v so result integer
      const m = randInt(1,10)*2, v = randInt(2,10);
      const ke = Math.round(0.5*m*v*v);
      const {opts, ans} = mcqFromValue(ke, ' J');
      return Q(`Find the kinetic energy of a body of mass ${m} kg moving at ${v} m/s (KE = ½mv²).`, opts, ans);
    },
  ];
  return templates[randInt(0,templates.length-1)]();
}

function genNeetQuestion(){
  const templates = [
    ()=>{ // dilution / concentration style basic ratio, keep as CRT-like but bio/chem flavored
      const total = randInt(20,100)*2;
      const half = total/2;
      const {opts, ans} = mcqFromValue(half);
      return Q(`In a population of ${total} pea plants following a monohybrid cross with a 1:1 phenotypic ratio, how many plants are expected to show the dominant trait?`, opts, ans);
    },
    ()=>{ // simple ratio-based genetics: 3:1 ratio
      const unit = randInt(5,40);
      const total = unit*4;
      const dominant = unit*3;
      const {opts, ans} = mcqFromValue(dominant);
      return Q(`In a monohybrid cross showing a 3:1 phenotypic ratio, if there are ${total} offspring in total, how many are expected to show the dominant phenotype?`, opts, ans);
    },
    ()=>{ // heart rate / pulse over time
      const rate = randInt(60,100), minutes = randInt(2,10);
      const beats = rate*minutes;
      const {opts, ans} = mcqFromValue(beats, ' beats');
      return Q(`A person's heart beats at ${rate} beats per minute. How many times does it beat in ${minutes} minutes?`, opts, ans);
    },
    ()=>{ // magnification = image size / object size, keep integers
      const objectSize = randInt(2,10), magnification = randInt(2,20);
      const imageSize = objectSize*magnification;
      const {opts, ans} = mcqFromValue(magnification, 'x');
      return Q(`Under a microscope, an object of actual size ${objectSize} µm appears as ${imageSize} µm. What is the magnification (image size / object size)?`, opts, ans);
    },
  ];
  return templates[randInt(0,templates.length-1)]();
}

const PROCEDURAL_SUBJECTS = ['python','java','c','cpp','crt','jee','neet'];
function genProceduralQuestion(subjectId){
  if(subjectId==='crt') return genCrtQuestion();
  if(subjectId==='jee') return genJeeQuestion();
  if(subjectId==='neet') return genNeetQuestion();
  return genArithmeticQuestion(subjectId);
}

    'auth/admin-restricted-operation': 'sign-ups are disabled for this project — Authentication → Settings → User actions → enable "create (sign-up)".',
    'auth/invalid-api-key': 'the apiKey in FIREBASE_CONFIG is wrong — copy it again from Project settings → Your apps.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'the apiKey in FIREBASE_CONFIG is wrong — copy it again from Project settings → Your apps.',
    'auth/unauthorized-domain': 'this domain isn\'t authorized — add it under Authentication → Settings → Authorized domains.',
    'auth/app-not-authorized': 'this app/domain isn\'t authorized for this API key — check Authorized domains and any API-key restrictions.',
    'auth/quota-exceeded': 'Firebase\'s email quota is used up for today — try again later.',
    'auth/operation-not-supported-in-this-environment': 'open this page over http(s) (localhost or a hosted URL), not file://.',
    'auth/popup-blocked': 'the browser blocked the Google popup — allow popups for this site and try again.',
    'auth/account-exists-with-different-credential': 'this email is already registered with a different sign-in method.',
    'auth/internal-error': 'Firebase reported an internal error — check the console for details.',
  };
  if(map[c]) return map[c];
  const detail = c || (e && e.message ? String(e.message).slice(0,120) : 'unknown');
  return 'something went wrong ('+detail+') — open the browser console (F12) for details.';
}

/* ---------------- Firestore data layer ----------------
   scores/{uid}                -> { name, subjects:{ <subject>:{score,total} }, updatedAt }   (one doc per user, best per subject)
   users/{uid}/attempts/{id}   -> { subject, score, total, ts }                                 (private history)
   Emails are never written to Firestore, so the public leaderboard exposes only display names and scores. */
async function recordAttempt(att){
  const uid = auth.currentUser.uid;
  const name = state.currentUser.name;
  await addDoc(collection(db,'users',uid,'attempts'), {
    subject: att.subject, score: att.score, total: att.total, ts: serverTimestamp(),
  });
  if(att.total < MIN_Q_FOR_RANK) return;
  const ref = doc(db,'scores',uid);
  await runTransaction(db, async (tx)=>{
    const snap = await tx.get(ref);
    const subjects = (snap.exists() && snap.data().subjects) ? {...snap.data().subjects} : {};
    const prev = subjects[att.subject];
    const pct = att.score/att.total;
    const better = !prev || pct > prev.score/prev.total || (pct === prev.score/prev.total && att.score > prev.score);
    if(better) subjects[att.subject] = {score: att.score, total: att.total};
    tx.set(ref, {name, subjects, updatedAt: serverTimestamp()});
  });
  lbCache = null;
}

let lbCache = null;
async function loadLeaderboard(force){
  if(!force && lbCache && Date.now()-lbCache.t < 30000) return lbCache.users;
  const snap = await getDocs(query(collection(db,'scores'), limit(500)));
  const users = snap.docs.map(d=>({uid:d.id, ...d.data()}));
  lbCache = {t: Date.now(), users};
  return users;
}

async function loadMyAttempts(){
  const uid = auth.currentUser.uid;
  const snap = await getDocs(query(collection(db,'users',uid,'attempts'), orderBy('ts','desc'), limit(200)));
  return snap.docs.map(d=>{
    const x = d.data();
    return {subject:x.subject, score:x.score, total:x.total, ts: x.ts && x.ts.toMillis ? x.ts.toMillis() : Date.now()};
  });
}

/* ---------------- app state ---------------- */
const root = document.getElementById('root');
let state = {
  screen: FB_READY ? 'boot' : 'setup', // setup | boot | login | signup | verify | reset | dashboard | profile | gkCategory | quiz | result | rankings
  authErr: '',
  authInfo: '',
  formEmail: '',
  currentUser: null, // {uid, email, name}
  loading: false,
  quiz: null,
  lastResult: null,
  lastBestStreak: 0,
  saveErr: '',
  finishing: false,
  rankSubjectFilter: 'all',
};

function leaveQuiz(){ clearTimer(); state.quiz = null; state.finishing = false; }

function setSignedIn(user){
  state.currentUser = {uid:user.uid, email:user.email, name:user.displayName || user.email.split('@')[0]};
  state.authErr = ''; state.authInfo = '';
  if(['boot','login','signup','verify','reset'].includes(state.screen)) state.screen = 'dashboard';
}

if(FB_READY){
  // restores the session on refresh and reacts to sign-in / sign-out from anywhere
  onAuthStateChanged(auth, (user)=>{
    if(user && user.emailVerified){
      setSignedIn(user);
    } else if(user){
      state.currentUser = null;
      if(['boot','login','signup'].includes(state.screen)) state.screen = 'verify';
    } else {
      leaveQuiz();
      state.currentUser = null;
      if(!['login','signup','reset'].includes(state.screen)) state.screen = 'login';
    }
    render();
  });
}

function render(){
  root.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='app';
  const term = document.createElement('div'); term.className='term';
  const bar = document.createElement('div'); bar.className='term-bar';
  bar.innerHTML = `<span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="term-path">${escapeHtml(termPath())}</span>`;
  term.appendChild(bar);
  const body = document.createElement('div'); body.className='term-body';
  term.appendChild(body);
  wrap.appendChild(term);
  root.appendChild(wrap);

  const s = state.screen;
  if(s==='setup') renderSetup(body);
  else if(s==='boot') renderBoot(body);
  else if(s==='login') renderLogin(body);
  else if(s==='signup') renderSignup(body);
  else if(s==='verify') renderVerify(body);
  else if(s==='reset') renderReset(body);
  else if(!state.currentUser) { state.screen='login'; renderLogin(body); }
  else if(s==='dashboard') renderDashboard(body);
  else if(s==='profile') renderProfile(body);
  else if(s==='gkCategory') renderGkCategory(body);
  else if(s==='quiz' && state.quiz) renderQuiz(body);
  else if(s==='result' && state.lastResult) renderResult(body);
  else if(s==='rankings') renderRankings(body);
  else { state.screen='dashboard'; renderDashboard(body); }
}

function termPath(){
  const s = state.screen;
  if(['setup','boot','login','signup','verify','reset'].includes(s) || !state.currentUser) return 'guest@compile-rank: ~/'+(s==='verify'?'verify-email':s==='boot'?'':s);
  const u = state.currentUser.email.split('@')[0];
  if(s==='dashboard') return u+'@compile-rank: ~/subjects';
  if(s==='profile') return u+'@compile-rank: ~/profile';
  if(s==='gkCategory') return u+'@compile-rank: ~/gk/topics';
  if(s==='quiz' && state.quiz) return u+'@compile-rank: ~/quiz/'+state.quiz.subject;
  if(s==='result') return u+'@compile-rank: ~/result';
  if(s==='rankings') return u+'@compile-rank: ~/rankings';
  return u+'@compile-rank: ~';
}

/* ---------------- SIGNUP ---------------- */
function renderSignup(body){
  heroBlock(body, 'create account', 'We\'ll email you a link to confirm your address. The leaderboard shows your name and scores only — never your email.');
  body.appendChild(googleSection());
  const form=document.createElement('form');
  form.innerHTML = `
    <label>full name</label>
    <input type="text" id="su-name" placeholder="Jane Doe" maxlength="40" autocomplete="name" required>
    <label>email</label>
    <input type="email" id="su-email" placeholder="you@college.edu" autocomplete="email" required>
    <label>password</label>
    <input type="password" id="su-pass" placeholder="min ${MIN_PASS} characters" minlength="${MIN_PASS}" autocomplete="new-password" required>
  `;
  form.querySelector('#su-email').value = state.formEmail;
  const btn=document.createElement('button'); btn.type='submit'; btn.className='btn'; btn.textContent=state.loading?'creating...':'create account →';
  btn.disabled = state.loading;
  form.appendChild(btn);
  form.appendChild(msgLine(state.authErr));
  const sw=document.createElement('div'); sw.className='switch-line';
  sw.innerHTML = `already registered? <a id="go-login">log in</a>`;
  form.appendChild(sw);

  form.onsubmit = async (e)=>{
    e.preventDefault();
    const name = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const pass = document.getElementById('su-pass').value;
    if(!name){ state.authErr='please enter your name.'; render(); return; }
    state.formEmail = email; state.loading=true; state.authErr=''; render();
    let cred;
    try{
      cred = await createUserWithEmailAndPassword(auth, email, pass);
    }catch(err){
      console.error('signup failed:', err);
      state.loading=false; state.authErr = authMsg(err); render(); return;
    }
    // the account now exists — a failure below must not make it look like signup failed
    try{ await updateProfile(cred.user, {displayName: name}); }
    catch(err){ console.error('could not save display name:', err); }
    try{
      await sendEmailVerification(cred.user);
      state.authErr=''; state.authInfo='verification email sent.';
    }catch(err){
      console.error('verification email failed:', err);
      state.authInfo=''; state.authErr='account created, but the verification email could not be sent — '+authMsg(err)+' You can press "resend email" below.';
    }
    state.loading=false; state.screen='verify'; render();
  };
  body.appendChild(form);
  setTimeout(()=>{ const g=document.getElementById('go-login'); if(g) g.onclick=()=>{state.screen='login'; state.authErr=''; render();}; },0);
}

/* ---------------- VERIFY EMAIL ---------------- */
function renderVerify(body){
  const u = auth.currentUser;
  if(!u){ state.screen='login'; renderLogin(body); return; }
  heroBlock(body, 'verify your email', `We sent a verification link to ${u.email}. Open it, then come back and press continue. Check spam if it doesn't show up.`);

  const btn=document.createElement('button'); btn.className='btn'; btn.textContent=state.loading?'checking...':'i\'ve verified — continue →';
  btn.disabled = state.loading;
  body.appendChild(btn);
  body.appendChild(msgLine(state.authErr));
  if(state.authInfo) body.appendChild(msgLine(state.authInfo, true));

  const sw=document.createElement('div'); sw.className='switch-line';
  sw.innerHTML = `didn't get it? <a id="resend-ver">resend email</a> &nbsp;·&nbsp; <a id="cancel-ver">use a different account</a>`;
  body.appendChild(sw);

  btn.onclick = async ()=>{
    state.loading=true; state.authErr=''; state.authInfo=''; render();
    try{
      await reload(u);
      state.loading=false;
      if(u.emailVerified){
        await u.getIdToken(true);   // refresh token so Firestore rules see email_verified = true
        setSignedIn(u);
      } else {
        state.authErr = 'not verified yet — open the link in the email first.';
      }
    }catch(err){ state.loading=false; state.authErr = authMsg(err); }
    render();
  };
  setTimeout(()=>{
    const r=document.getElementById('resend-ver');
    if(r) r.onclick = async ()=>{
      try{ await sendEmailVerification(u); state.authErr=''; state.authInfo='a new verification email is on its way.'; }
      catch(err){ state.authInfo=''; state.authErr = authMsg(err); }
      render();
    };
    const c=document.getElementById('cancel-ver');
    if(c) c.onclick = async ()=>{ state.authErr=''; state.authInfo=''; state.screen='login'; try{ await signOut(auth); }catch(e){} render(); };
  },0);
}

  `;
  body.appendChild(card);

  const nl=document.createElement('label'); nl.textContent='display name (shown on the leaderboard)';
  body.appendChild(nl);
  const nameInput=document.createElement('input'); nameInput.type='text'; nameInput.id='pf-name'; nameInput.value=user.name||''; nameInput.maxLength=40;
  body.appendChild(nameInput);
  const emailLabel=document.createElement('label'); emailLabel.textContent='email';
  body.appendChild(emailLabel);
  const emailInput=document.createElement('input'); emailInput.type='email'; emailInput.id='pf-email'; emailInput.value=user.email; emailInput.disabled=true; emailInput.style.opacity='0.6'; emailInput.style.cursor='not-allowed';
  body.appendChild(emailInput);

  const saveBtn=document.createElement('button'); saveBtn.className='btn'; saveBtn.textContent='save changes';
  const saveErr=document.createElement('div'); saveErr.className='err';
  saveBtn.onclick = async ()=>{
    const newName = nameInput.value.trim();
    if(!newName){ saveErr.textContent='name can\'t be empty.'; return; }
    saveErr.textContent='';
    saveBtn.disabled=true; saveBtn.textContent='saving...';
    try{
      await updateProfile(auth.currentUser, {displayName: newName});
      try{ await updateDoc(doc(db,'scores',user.uid), {name:newName}); }catch(e){ /* no scores doc yet — fine */ }
      state.currentUser.name = newName;
      lbCache = null;
      render();
    }catch(e){
      console.error(e);
      saveErr.textContent='could not save — '+authMsg(e);
      saveBtn.disabled=false; saveBtn.textContent='save changes';
    }
  };
  body.appendChild(saveBtn);
  body.appendChild(saveErr);

  const h2=document.createElement('div'); h2.style.fontFamily='var(--mono)'; h2.style.fontSize='12px'; h2.style.color='var(--muted)'; h2.style.margin='28px 0 10px'; h2.textContent='TEST HISTORY';
  body.appendChild(h2);

  const histBox=document.createElement('div');
  body.appendChild(histBox);
  const nav=document.createElement('div'); nav.className='nav-row';
  const back=document.createElement('button'); back.className='btn ghost'; back.textContent='← back to subjects';
  back.onclick = ()=>{ state.screen='dashboard'; render(); };
  nav.appendChild(back);
  body.appendChild(nav);

  histBox.innerHTML='<div class="empty">loading history…</div>';
  let attempts;
  try{ attempts = await loadMyAttempts(); }
  catch(e){ console.error(e); histBox.innerHTML='<div class="empty">couldn\'t load your history — check the Firestore rules.</div>'; return; }
  histBox.innerHTML='';

  if(attempts.length===0){
    histBox.innerHTML='<div class="empty">no attempts yet — take a test to see your stats here.</div>';
    return;
  }
  const totalTests = attempts.length;
  const totalScore = attempts.reduce((s,a)=>s+a.score,0);
  const totalQs = attempts.reduce((s,a)=>s+a.total,0);
  const avgPct = Math.round(totalScore/totalQs*100);
  const bySubject = {};
  attempts.forEach(a=>{
    const cur = bySubject[a.subject];
    if(!cur || a.score/a.total > cur.score/cur.total) bySubject[a.subject]=a;
  });
  const stat=(v,l)=>`<div style="background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px;">
        <div style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--accent);">${v}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${l}</div></div>`;
  const statsGrid=document.createElement('div');
  statsGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;';
  statsGrid.innerHTML = stat(totalTests,'tests taken')+stat(avgPct+'%','average score')+stat(Object.keys(bySubject).length,'subjects tried');
  histBox.appendChild(statsGrid);

  const t1=document.createElement('table'); t1.className='lb';
  t1.innerHTML = `<thead><tr><th>subject</th><th>best score</th><th>%</th></tr></thead>`;
  const tb1=document.createElement('tbody');
  Object.values(bySubject).sort((a,b)=> (b.score/b.total)-(a.score/a.total)).forEach(a=>{
    const subj = SUBJECTS.find(s=>s.id===a.subject);
    const tr=document.createElement('tr');
    tr.innerHTML = `<td style="color:${subj?subj.color:'var(--text)'}">${subj?escapeHtml(subj.label):escapeHtml(a.subject)}</td><td>${a.score}/${a.total}</td><td>${Math.round(a.score/a.total*100)}%</td>`;
    tb1.appendChild(tr);
  });
  t1.appendChild(tb1);
  histBox.appendChild(t1);

  const h3=document.createElement('div'); h3.style.cssText='font-family:var(--mono);font-size:12px;color:var(--muted);margin:24px 0 6px;'; h3.textContent='RECENT ATTEMPTS';
  histBox.appendChild(h3);
  const t2=document.createElement('table'); t2.className='lb';
  t2.innerHTML = `<thead><tr><th>when</th><th>subject</th><th>score</th><th>%</th></tr></thead>`;
  const tb2=document.createElement('tbody');
  attempts.slice(0,10).forEach(a=>{
    const subj = SUBJECTS.find(s=>s.id===a.subject);
    const tr=document.createElement('tr');
    tr.innerHTML = `<td style="color:var(--muted)">${escapeHtml(fmtDate(a.ts))}</td><td style="color:${subj?subj.color:'var(--text)'}">${subj?escapeHtml(subj.label):escapeHtml(a.subject)}</td><td>${a.score}/${a.total}</td><td>${Math.round(a.score/a.total*100)}%</td>`;
    tb2.appendChild(tr);
  });
  t2.appendChild(tb2);
  histBox.appendChild(t2);
}


/* ---------------- GK CATEGORY PICKER ---------------- */
function renderGkCategory(body){
  body.appendChild(brandRow(true));
  const h=document.createElement('h1'); h.className='hero';
  h.innerHTML='general knowledge<span class="cursor"></span>';
  body.appendChild(h);
  const p=document.createElement('p'); p.className='sub';
  p.textContent = `Pick a topic to focus on, or run a mixed test drawing from all ${BANK.gk.length} questions across ${GK_CATEGORIES.length-1} topics. Each test is 15 questions, and every answer comes with a short explanation once you lock it in.`;
  body.appendChild(p);

  const grid=document.createElement('div'); grid.className='grid';
  GK_CATEGORIES.forEach(cat=>{
    const count = cat==='All' ? BANK.gk.length : BANK.gk.filter(q=>q.cat===cat).length;
    const c=document.createElement('div'); c.className='card';
    c.innerHTML = `<div class="tag" style="background:var(--gk)"></div>
      <div class="lang" style="color:var(--gk)">${cat}</div>
      <div class="desc">${cat==='All' ? 'A mixed set drawn from every topic.' : cat+' questions only.'}</div>
      <div class="count"><b>${count}</b> curated questions</div>`;
    c.onclick = ()=> startQuiz('gk', cat==='All' ? null : cat);
    grid.appendChild(c);
  });
  body.appendChild(grid);

  const nav=document.createElement('div'); nav.className='nav-row';
  const back=document.createElement('button'); back.className='btn ghost'; back.textContent='← back to subjects';
  back.onclick = ()=>{ state.screen='dashboard'; render(); };
  nav.appendChild(back);
  body.appendChild(nav);
}

/* ---------------- QUIZ ---------------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function startQuiz(subjectId, gkCategory){
  let questions;
  if(PROCEDURAL_SUBJECTS.includes(subjectId)){
    // mix a few curated bank questions with freshly generated, randomized ones
    const staticPool = shuffle(BANK[subjectId]);
    const staticQs = staticPool.slice(0, 5);
    const proceduralQs = Array.from({length:10}, ()=> genProceduralQuestion(subjectId));
    questions = shuffle([...staticQs, ...proceduralQs]);
  } else if(subjectId==='gk' && gkCategory){
    const pool = shuffle(BANK.gk.filter(q=>q.cat===gkCategory));
    questions = pool.slice(0, Math.min(15, pool.length));
  } else {
    const pool = shuffle(BANK[subjectId]);
    questions = pool.slice(0, Math.min(15, pool.length));
  }
  state.quiz = {
    subject: subjectId,
    questions,
    idx: 0,
    selected: new Array(questions.length).fill(null),
    locked: false,
    timeLeft: 40,
    timerId: null,
    streak: 0,
    bestStreak: 0,
  };
  state.screen='quiz';
  render();
  startTimer();
}

function startTimer(){
  clearTimer();
  state.quiz.timerId = setInterval(()=>{
    state.quiz.timeLeft -= 1;
    if(state.quiz.timeLeft <= 0){
      clearTimer();
      lockAndAdvance(true);
      return;
    }
    updateTimerDisplay();
  },1000);
}
function clearTimer(){ if(state.quiz && state.quiz.timerId){ clearInterval(state.quiz.timerId); state.quiz.timerId=null; } }
function updateTimerDisplay(){
  const el = document.getElementById('qtimer');
  const pb = document.getElementById('qprogress');
  if(el){ el.textContent = state.quiz.timeLeft+'s'; el.className = 'timer'+(state.quiz.timeLeft<=10?' low':''); }
  if(pb){ pb.style.width = (state.quiz.timeLeft/40*100)+'%'; }
}

function renderQuiz(body){
  const q = state.quiz;
  const subj = SUBJECTS.find(s=>s.id===q.subject);
  body.appendChild(brandRow(true));

  const pbwrap=document.createElement('div'); pbwrap.className='progressbar';
  const pbinner=document.createElement('div'); pbinner.id='qprogress'; pbinner.style.width=(q.timeLeft/40*100)+'%';
  pbwrap.appendChild(pbinner);
  body.appendChild(pbwrap);

  const streakBadge = q.streak>=2 ? `<span style="color:var(--amber)">🔥 ${q.streak} streak</span>` : '';
  const curForBadge = q.questions[q.idx];
  const topicBadge = (q.subject==='gk' && curForBadge.cat) ? `<span style="color:var(--muted)">· ${escapeHtml(curForBadge.cat)}</span>` : '';
  const meta=document.createElement('div'); meta.className='qmeta';
  meta.innerHTML = `<span style="color:${subj.color}">${subj.label}</span>${topicBadge}<span>question ${q.idx+1} / ${q.questions.length}</span>${streakBadge}<span id="qtimer" class="timer${q.timeLeft<=10?' low':''}">${q.timeLeft}s</span>`;
  body.appendChild(meta);

  const cur = q.questions[q.idx];
  const qt=document.createElement('p'); qt.className='qtext'; qt.textContent = cur.text;
  body.appendChild(qt);

  const letters=['A','B','C','D'];
  const answered = q.locked;
  cur.opts.forEach((opt,i)=>{
    const o=document.createElement('div'); o.className='opt';
    if(q.selected[q.idx]===i && !answered) o.classList.add('selected');
    if(answered){
      if(i===cur.ans) o.classList.add('correct');
      else if(i===q.selected[q.idx]) o.classList.add('wrong');
      o.style.cursor='default';
    }
    o.innerHTML = `<span class="k">${letters[i]}</span><span>${escapeHtml(opt)}</span>`;
    o.onclick = ()=>{
      if(q.locked) return;
      clearTimer();
      q.selected[q.idx] = i;
      q.locked = true;
      if(i===cur.ans){ q.streak += 1; q.bestStreak = Math.max(q.bestStreak, q.streak); }
      else { q.streak = 0; }
      render();
    };
    body.appendChild(o);
  });

  if(answered && cur.exp){
    const exp=document.createElement('div');
    exp.style.cssText = 'margin-top:12px;padding:12px 14px;border-radius:8px;background:rgba(0,217,160,0.06);border:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.5;';
    exp.innerHTML = `<b style="color:var(--text)">Why: </b>${escapeHtml(cur.exp)}`;
    body.appendChild(exp);
  }

  const foot=document.createElement('div'); foot.className='qfooter';
  const skip=document.createElement('button'); skip.className='btn ghost'; skip.textContent='skip';
  skip.onclick = ()=> lockAndAdvance(false);
  skip.style.display = answered ? 'none' : 'inline-flex';
  const next=document.createElement('button'); next.className='btn'; next.textContent = q.idx===q.questions.length-1?'finish test →':'next →';
  next.disabled = q.selected[q.idx]===null;
  next.onclick = ()=> lockAndAdvance(false);
  foot.appendChild(skip);
  foot.appendChild(next);
  body.appendChild(foot);
}

function lockAndAdvance(){
  clearTimer();
  const q = state.quiz;
  if(q.idx < q.questions.length-1){
    q.idx += 1;
    q.timeLeft = 40;
    q.locked = false;
    render();
    startTimer();
  } else {
    finishQuiz();
  }
}

async function finishQuiz(){
  const q = state.quiz;
  if(!q || state.finishing) return;
  state.finishing = true;
  clearTimer();
  let score = 0;
  q.questions.forEach((qq,i)=>{ if(q.selected[i]===qq.ans) score++; });
  const attempt = { subject: q.subject, score, total: q.questions.length, ts: Date.now() };
  state.saveErr = '';
  try{ await recordAttempt(attempt); }
  catch(e){ console.error('saving attempt failed', e); state.saveErr = (e && e.code==='permission-denied') ? 'permission denied — check your Firestore rules and that your email is verified.' : 'check your connection and try again.'; }
  state.lastResult = attempt;
  state.lastBestStreak = q.bestStreak || 0;
  state.rankSubjectFilter = q.subject;
  state.quiz = null;
  state.finishing = false;
  state.screen = 'result';
  render();
}

/* ---------------- LEADERBOARD ---------------- */
function computeRows(users, filter){
  const rows = [];
  if(filter==='all'){
    users.forEach(u=>{
      const subs = u.subjects||{}; const keys = Object.keys(subs);
      if(!keys.length) return;
      let score=0,total=0;
      keys.forEach(k=>{ score+=subs[k].score; total+=subs[k].total; });
      rows.push({uid:u.uid, name:u.name, score, total, subjects:keys.length});
    });
    rows.sort((a,b)=> b.score-a.score || (b.score/b.total)-(a.score/a.total));
  } else {
    users.forEach(u=>{
      const s = (u.subjects||{})[filter];
      if(s) rows.push({uid:u.uid, name:u.name, score:s.score, total:s.total});
    });
    rows.sort((a,b)=> (b.score/b.total)-(a.score/a.total) || b.score-a.score);
  }
  const keyOf = r => filter==='all' ? r.score+'|'+(r.score/r.total).toFixed(4) : (r.score/r.total).toFixed(4)+'|'+r.score;
  rows.forEach((r,i)=>{ r.rank = (i>0 && keyOf(r)===keyOf(rows[i-1])) ? rows[i-1].rank : i+1; });
  return rows;
}

function buildLeaderboardTable(rows, filter, myUid){
  const wrap=document.createElement('div');
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty">no attempts recorded yet — be the first.</div>`;
    return wrap;
  }
  const isAll = filter==='all';
  const table=document.createElement('table'); table.className='lb';
  table.innerHTML = isAll
    ? `<thead><tr><th>#</th><th>name</th><th>points</th><th>subjects</th><th>%</th></tr></thead>`
    : `<thead><tr><th>#</th><th>name</th><th>score</th><th>%</th></tr></thead>`;
  const tbody=document.createElement('tbody');
  const addRow = (row)=>{
    const tr=document.createElement('tr');
    const mine = row.uid===myUid;
    if(mine) tr.classList.add('me');
    const rc = row.rank===1?'top1':row.rank===2?'top2':row.rank===3?'top3':'';
    const pct = Math.round(row.score/row.total*100);
    const nm = escapeHtml(row.name||'anonymous')+(mine?' (you)':'');
    tr.innerHTML = isAll
      ? `<td class="rank ${rc}">${row.rank}</td><td>${nm}</td><td>${row.score}</td><td>${row.subjects}</td><td>${pct}%</td>`
      : `<td class="rank ${rc}">${row.rank}</td><td>${nm}</td><td>${row.score}/${row.total}</td><td>${pct}%</td>`;
    tbody.appendChild(tr);
  };
  rows.slice(0,15).forEach(addRow);
  const meIdx = rows.findIndex(r=>r.uid===myUid);
  if(meIdx>=15){
    const sep=document.createElement('tr');
    sep.innerHTML = `<td colspan="${isAll?5:4}" style="text-align:center;color:var(--muted);font-family:var(--mono);">⋯</td>`;
    tbody.appendChild(sep);
    addRow(rows[meIdx]);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

// fills `container` with a summary of the signed-in user's standing plus the table
async function leaderboardInto(container, filter){
  container.innerHTML = '<div class="empty">loading rankings…</div>';
  try{
    const users = await loadLeaderboard();
    const rows = computeRows(users, filter);
    container.innerHTML = '';
    const me = rows.find(r=>r.uid===state.currentUser.uid);
    const label = filter==='all' ? 'overall' : (SUBJECTS.find(s=>s.id===filter)||{label:filter}).label;
    const sum=document.createElement('div');
    sum.style.cssText='background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;font-family:var(--mono);font-size:12.5px;';
    if(me){
      const pct = Math.round(me.score/me.total*100);
      sum.innerHTML = `<span style="color:var(--accent)">your rank in ${escapeHtml(label)}: #${me.rank}</span> <span style="color:var(--muted)">of ${rows.length} · ${filter==='all' ? me.score+' pts across '+me.subjects+' subject'+(me.subjects===1?'':'s') : 'best '+me.score+'/'+me.total+' ('+pct+'%)'}</span>`;
    } else {
      sum.innerHTML = `<span style="color:var(--muted)">you haven't ranked in ${escapeHtml(label)} yet — finish a ${MIN_Q_FOR_RANK}+ question test to get on the board.</span>`;
    }
    container.appendChild(sum);
    container.appendChild(buildLeaderboardTable(rows, filter, state.currentUser.uid));
  }catch(e){
    console.error('leaderboard load failed', e);
    container.innerHTML = `<div class="empty">couldn't load rankings${e && e.code==='permission-denied' ? ' — check your Firestore rules' : ''}.</div>`;
  }
}

/* ---------------- RESULT ---------------- */
function renderResult(body){
  body.appendChild(brandRow(true));
  const r = state.lastResult;
  const subj = SUBJECTS.find(s=>s.id===r.subject);

  const h=document.createElement('h1'); h.className='hero';
  h.innerHTML = `test complete<span class="cursor"></span>`;
  body.appendChild(h);

  const hero=document.createElement('div'); hero.className='score-hero';
  const pct = Math.round(r.score/r.total*100);
  const streakLine = state.lastBestStreak>=3 ? `<div class="score-verdict">🔥 best streak this run: ${state.lastBestStreak} in a row</div>` : '';
  hero.innerHTML = `<div class="score-num">${r.score}/${r.total}</div>
    <div class="score-of">${pct}% correct — <span style="color:${subj.color}">${subj.label}</span></div>
    <div class="score-verdict">${verdict(pct)}</div>${streakLine}`;
  body.appendChild(hero);

  if(state.saveErr){
    const e=document.createElement('div'); e.className='err'; e.style.textAlign='center';
    e.textContent = 'your score could not be saved — '+state.saveErr;
    body.appendChild(e);
  } else if(r.total < MIN_Q_FOR_RANK){
    const n=document.createElement('div'); n.className='note'; n.style.textAlign='center'; n.style.border='none'; n.style.marginTop='0';
    n.textContent = `Saved to your history. Tests under ${MIN_Q_FOR_RANK} questions don't count toward rankings.`;
    body.appendChild(n);
  }

  const h2=document.createElement('div'); h2.style.fontFamily='var(--mono)'; h2.style.fontSize='12px'; h2.style.color='var(--muted)'; h2.style.margin='18px 0 10px'; h2.textContent = subj.label.toUpperCase()+' — TOP RANKS';
  body.appendChild(h2);
  const lb=document.createElement('div'); body.appendChild(lb);

  const nav=document.createElement('div'); nav.className='nav-row';
  const again=document.createElement('button'); again.className='btn'; again.textContent='retake this subject';
  again.onclick = ()=> startQuiz(r.subject);
  const dash=document.createElement('button'); dash.className='btn ghost'; dash.textContent='back to subjects';
  dash.onclick = ()=>{ state.screen='dashboard'; render(); };
  const allrank=document.createElement('button'); allrank.className='btn ghost'; allrank.textContent='view full rankings →';
  allrank.onclick = ()=>{ state.screen='rankings'; render(); };
  nav.appendChild(again); nav.appendChild(dash); nav.appendChild(allrank);
  body.appendChild(nav);

  leaderboardInto(lb, r.subject);
}

function verdict(pct){
  if(pct===100) return 'Flawless run. Nothing left uncovered.';
  if(pct>=80) return 'Strong result — you know this material well.';
  if(pct>=60) return 'Solid, with a few gaps worth revisiting.';
  if(pct>=40) return 'Middling — another pass through the basics will help.';
  return 'Rough round. Review the fundamentals and try again.';
}

/* ---------------- RANKINGS ---------------- */
function renderRankings(body){
  body.appendChild(brandRow(true));
  const h=document.createElement('h1'); h.className='hero';
  h.innerHTML='rankings<span class="cursor"></span>';
  body.appendChild(h);
  const p=document.createElement('p'); p.className='sub';
  p.textContent = state.rankSubjectFilter==='all'
    ? 'Overall = the sum of each person\'s best score in every subject, so trying more subjects earns more points.'
    : 'Best score per person in this subject. Switch tabs to compare.';
  body.appendChild(p);

  const tabbar=document.createElement('div'); tabbar.className='tabbar';
  const mkTab=(id,label)=>{
    const t=document.createElement('div'); t.className='tab'+(state.rankSubjectFilter===id?' active':''); t.textContent=label;
    t.onclick = ()=>{ state.rankSubjectFilter=id; render(); };
    tabbar.appendChild(t);
  };
  mkTab('all','overall');
  SUBJECTS.forEach(s=>mkTab(s.id,s.label));
  body.appendChild(tabbar);

  const lb=document.createElement('div'); body.appendChild(lb);

  const nav=document.createElement('div'); nav.className='nav-row';
  const dash=document.createElement('button'); dash.className='btn ghost'; dash.textContent='← back to subjects';
  dash.onclick = ()=>{ state.screen='dashboard'; render(); };
  const refresh=document.createElement('button'); refresh.className='btn ghost'; refresh.textContent='refresh';
  refresh.onclick = ()=>{ lbCache=null; render(); };
  nav.appendChild(dash); nav.appendChild(refresh);
  body.appendChild(nav);

  const note=document.createElement('div'); note.className='note';
  note.textContent = 'Only display names and scores are shared on this board — emails are never stored here. Tests shorter than '+MIN_Q_FOR_RANK+' questions don\'t count.';
  body.appendChild(note);

  leaderboardInto(lb, state.rankSubjectFilter);
}

render();
